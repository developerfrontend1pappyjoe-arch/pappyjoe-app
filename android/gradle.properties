# Project-wide Gradle settings.

# Keep heap moderate; Gradle cache must be on E: (see scripts/android-build-env.ps1) when C: is low on space.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -Djava.io.tmpdir=E:/rn-temp
org.gradle.parallel=false
org.gradle.workers.max=2

android.useAndroidX=true
# RN 0.80+ is AndroidX-only; Jetifier OOMs on react-android AAR.
android.enableJetifier=false

# 32-bit + 64-bit ABIs (armeabi-v7a required for many pre-Android-12 / 32-bit devices).
# arm64-v8a/x86_64 remain for 64-bit devices and Play 16 KB page-size compliance.
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

newArchEnabled=false
hermesEnabled=true

MYAPP_UPLOAD_STORE_FILE=AndroidKey.jks
MYAPP_UPLOAD_KEY_ALIAS=key0
MYAPP_UPLOAD_STORE_PASSWORD=Pappyjoe123@
MYAPP_UPLOAD_KEY_PASSWORD=Pappyjoe123@
